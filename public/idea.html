<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessHome Ideas</title>
  <style>
    :root {
      --chess-bg: #1a1a1d;
      --card-bg: #2b2b32;
      --text-main: #e0e0e0;
      --text-muted: #999;
      --accent-gold: #d4af37;
      --status-liked: #2ecc71;
      --status-dev: #3498db;
      --status-rejected: #e74c3c;
      --border: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--chess-bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }

    /* Header как у ChessHome */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(26, 26, 29, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-weight: 700;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .knight-icon {
      font-size: 1.6rem;
      color: var(--accent-gold);
    }
    nav ul { display: flex; gap: 1.2rem; list-style: none; }
    nav a:hover { color: var(--accent-gold); }

    main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }

    h1 { margin-bottom: 0.8rem; font-weight: 600; }
    .lead { color: var(--text-muted); margin-bottom: 2rem; }

    /* Форма */
    #idea-form { background: var(--card-bg); padding: 1.8rem; border-radius: 8px; border: 1px solid var(--border); }
    label { display: block; margin-top: 1rem; font-size: 0.9rem; color: var(--text-muted); }
    input[type="text"], textarea {
      width: 100%; padding: 0.7rem; margin-top: 0.4rem; background: #1f1f24;
      border: 1px solid var(--border); color: white; border-radius: 4px;
    }
    textarea { min-height: 120px; resize: vertical; }
    button.primary {
      margin-top: 1.3rem; padding: 0.8rem 1.6rem; background: var(--accent-gold);
      color: #000; font-weight: 600; border: none; border-radius: 4px; cursor: pointer;
    }
    button.primary:hover { background: #bfa02e; }

    /* Список идей */
    .idea-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 1.2rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.6rem;
    }
    .idea-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.8rem; }
    .idea-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.3rem; }
    .idea-meta { font-size: 0.85rem; color: var(--text-muted); }
    .idea-text { color: #ccc; margin-top: 0.5rem; line-height: 1.4; }
    .status-badge {
      padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.8rem;
      color: white; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .status-liked { background: var(--status-liked); }
    .status-dev { background: var(--status-dev); }
    .status-rejected { background: var(--status-rejected); }

    .admin-actions {
      margin-top: 1rem; display: flex; gap: 0.6rem; flex-wrap: wrap;
    }
    .btn-admin {
      padding: 0.4rem 0.8rem; border: none; border-radius: 4px; color: white;
      cursor: pointer; font-size: 0.8rem; text-transform: uppercase;
    }
    .btn-liked { background: var(--status-liked); color: #0a0a0a; }
    .btn-dev { background: var(--status-dev); }
    .btn-rejected { background: var(--status-rejected); }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: stretch; gap: 1rem; }
      nav ul { justify-content: center; }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">
      <span class="knight-icon">♞</span>
      <span>ChessHome</span><span class="dot">.pro</span>
    </a>
    <nav>
      <ul>
        <li><a href="/">Главная</a></li>
        <li><a href="/ideas" class="active">Идеи</a></li>
        <!-- сюда можно добавить другие пункты -->
      </ul>
    </nav>
  </header>

  <main>
    <h1>Доска идей</h1>
    <p class="lead">
      Предложи идею для ChessHome. Команда (GGbers, shahmati_23, ChessHome) рассмотрит и отметит статус:
      <b>понравилось</b>, <b>в разработке</b> или <b>не понравилось</b>.
      Комментарии не предусмотрены — только предложения и оценка команды.
    </p>

    <section id="idea-form">
      <form id="ideaForm">
        <label for="title">Заголовок идеи</label>
        <input type="text" id="title" name="title" placeholder="Например: рейтинг клубов и матчи между ними" required>

        <label for="text">Описание</label>
        <textarea id="text" name="text" placeholder="Расскажите подробнее, что хотите видеть, и почему это важно для игроков." required></textarea>

        <label for="author">Ваше имя (необязательно)</label>
        <input type="text" id="author" name="author" placeholder="Ник или имя">

        <button type="button" class="primary" onclick="submitIdea()">Отправить идею</button>
      </form>
    </section>

    <section id="idea-list">
      <!-- Сюда JavaScript будет вставлять карточки идей -->
    </section>
  </main>

  <script src="ideas.js"></script>
</body>
</html>
