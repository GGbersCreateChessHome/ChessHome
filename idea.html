<!-- ===== ChessHome: Ящик идей ===== -->
<style>
  .ch-idea-box{max-width:520px;margin:24px auto;background:#1e1e2f;color:#eee;
    border-radius:16px;padding:24px;font-family:Arial,sans-serif;
    box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .ch-idea-box h3{margin:0 0 6px;color:#f5d76e;display:flex;align-items:center;gap:8px}
  .ch-idea-box textarea{width:100%;min-height:90px;box-sizing:border-box;margin-top:12px;
    background:#2b2b40;border:1px solid #444;color:#fff;border-radius:10px;
    padding:12px;font-size:15px;resize:vertical}
  .ch-idea-box textarea:focus{outline:none;border-color:#f5d76e}
  .ch-idea-box button{margin-top:12px;background:linear-gradient(135deg,#f5d76e,#e0a832);
    border:none;color:#222;font-weight:bold;padding:12px 22px;border-radius:10px;
    cursor:pointer;font-size:15px;transition:transform .15s}
  .ch-idea-box button:hover{transform:scale(1.04)}
  .ch-idea-box button:disabled{background:#555;color:#999;cursor:not-allowed;transform:none}
  .ch-counter{font-size:13px;color:#aaa;margin-top:8px}
  .ch-msg{margin-top:10px;font-size:14px;min-height:18px}
  .ch-ok{color:#7ce38b}.ch-err{color:#ff8a80}
  .ch-list{margin-top:16px;border-top:1px solid #3a3a55;padding-top:10px;font-size:13px}
  .ch-list div{padding:6px 0;border-bottom:1px dashed #3a3a55}
</style>

<div class="ch-idea-box">
  <h3>♟️ Ящик идей ChessHome</h3>
  <div>Предложите, что улучшить на сайте — максимум 3 идеи в день!</div>
  <textarea id="chText" maxlength="500" placeholder="Например: добавить турнир по блицу по пятницам..."></textarea>
  <button id="chSend">Отправить идею</button>
  <div class="ch-counter" id="chCount"></div>
  <div class="ch-msg" id="chMsg"></div>
  <div class="ch-list" id="chList"></div>
</div>

<script>
(function(){
  var KEY_COUNT='chIdeasCount', KEY_DATE='chIdeasDate', KEY_LIST='chIdeasList', MAX=3;
  var btn=document.getElementById('chSend'),
      txt=document.getElementById('chText'),
      cnt=document.getElementById('chCount'),
      msg=document.getElementById('chMsg'),
      list=document.getElementById('chList');

  function today(){return new Date().toISOString().slice(0,10);}
  function getData(){
    var d=localStorage.getItem(KEY_DATE), c=0;
    if(d===today()){ c=parseInt(localStorage.getItem(KEY_COUNT))||0; }
    else { localStorage.setItem(KEY_DATE,today()); localStorage.setItem(KEY_COUNT,0); }
    return c;
  }
  function refresh(){
    var used=getData();
    cnt.textContent='Отправлено сегодня: '+used+' из '+MAX;
    btn.disabled = used>=MAX;
    if(used>=MAX) msg.textContent='Лимит на сегодня исчерпан — возвращайтесь завтра! ♟️';
    var ideas=JSON.parse(localStorage.getItem(KEY_LIST)||'[]');
    list.innerHTML=ideas.length?'<b>Ваши идеи:</b>':'';
    ideas.forEach(function(i){
      var d=document.createElement('div');
      d.textContent='♘ '+i;
      list.appendChild(d);
    });
  }
  btn.addEventListener('click',function(){
    var text=txt.value.trim();
    if(text.length<10){ msg.className='ch-msg ch-err'; msg.textContent='Напишите чуть подробнее — минимум 10 символов.'; return; }
    var used=getData();
    if(used>=MAX){ msg.className='ch-msg ch-err'; msg.textContent='Сегодня уже 3 идеи. Максимум!'; refresh(); return; }
    localStorage.setItem(KEY_COUNT,used+1);
    var ideas=JSON.parse(localStorage.getItem(KEY_LIST)||'[]');
    ideas.unshift(text); localStorage.setItem(KEY_LIST,JSON.stringify(ideas));
    txt.value=''; msg.className='ch-msg ch-ok';
    msg.textContent='Спасибо! Идея отправлена ♟️';
    refresh();
  });
  refresh();
})();
</script>
